- name: Skills
  alternatives:
  - name: Agent Skills specification
    url: https://agentskills.io
    repo: agentskills/agentskills
    search: Agent Skills open standard SKILL.md specification
    license: Apache-2.0 (code), CC-BY-4.0 (docs)
    install: read https://agentskills.io/specification.md
    use_when: you write a SKILL.md and need the exact format rules, best practices and the list of clients that load skills
    status: verified
    facts:
      checked: '2026-11-27'
      link: 200
      stars: 27698
      pushed: '2026-11-04'
      archived: false
      gh_license: Apache-2.0
    verified_by: auto
  - name: skills-ref
    url: https://github.com/agentskills/agentskills
    repo: agentskills/agentskills
    search: agentskills skills-ref validator
    license: Apache-2.0
    install: from the skills-ref/ folder of agentskills/agentskills
    use_when: you want to check a skill folder against the spec before publishing it
    note: an npm package named skills-ref (MIT) exists but its metadata has no repository link; not confirmed to be the same tool
    status: verified
    facts:
      checked: '2026-11-27'
      link: 200
      stars: 27698
      pushed: '2026-11-04'
      archived: false
      gh_license: Apache-2.0
    verified_by: auto
- name: Docs for agents
  default:
    name: Context7
    url: https://github.com/upstash/context7
    repo: upstash/context7
    npm: '@upstash/context7-mcp'
    search: Context7 MCP up-to-date code docs
    license: MIT (MCP server); the API backend and crawler are closed
    install: npx ctx7 setup, or remote https://mcp.context7.com/mcp (API key recommended for higher limits)
    use_when: the agent needs current, version-specific docs and code examples for a library instead of its training data
    status: verified
    facts:
      checked: '2026-11-27'
      link: 200
      stars: 65557
      pushed: '2026-11-27'
      archived: false
      gh_license: MIT
      npm_license: MIT
      npm_modified: '2026-11-27'
      npm_weekly: 964217
    verified_by: auto
