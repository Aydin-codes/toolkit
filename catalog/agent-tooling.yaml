  paid:
  - name: Figma MCP server
    url: https://github.com/figma/mcp-server-guide
    repo: figma/mcp-server-guide
    search: Figma MCP server Dev Mode guide
    license: Figma Developer Terms (not open source); free Starter use limited to 6 tool calls a month
    license_url: https://www.figma.com/legal/developer-terms/
    install: claude mcp add --transport http figma https://mcp.figma.com/mcp
    note: 'Full use needs a Dev or Full seat on a paid plan. Free option: export design tokens and screenshots by hand.'
    status: verified
    facts:
      checked: '2026-11-27'
      link: 200
      license_link: 200
      stars: 2242
      pushed: '2026-11-27'
      archived: false
      gh_license: null
    verified_by: auto
