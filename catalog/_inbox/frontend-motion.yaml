proposals:
  # ---------- Animation libraries ----------
  - branch: frontend/motion
    branch_title: Motion and effects
    section: Animation libraries
    tier: default
    name: Motion
    url: https://motion.dev
    repo: motiondivision/motion
    npm: motion
    search: Motion animation library motion.dev (formerly Framer Motion)
    license: MIT
    install: npm i motion
    use_when: you want spring, gesture, layout and exit animations in React or plain JS
    note: "Formerly Framer Motion; Motion One was merged into it, so don't list Motion One separately. Vue port: motion-v."
    status: candidate
  - branch: frontend/motion
    section: Animation libraries
    tier: alternatives
    name: GSAP
    url: https://gsap.com
    repo: greensock/GSAP
    npm: gsap
    search: GSAP GreenSock animation platform
    license: free, not open source (GSAP Standard "No Charge" license, owned by Webflow)
    license_url: https://gsap.com/community/standard-license/
    install: npm i gsap (React helper - npm i @gsap/react)
    use_when: you need timelines, SVG morphing, SplitText or scroll scenes; free for commercial use, but not allowed in no-code tools that compete with Webflow
    status: candidate
  - branch: frontend/motion
    section: Animation libraries
    tier: alternatives
    name: anime.js
    url: https://animejs.com
    repo: juliangarnier/anime
    npm: animejs
    search: anime.js JavaScript animation engine
    license: MIT
    install: npm i animejs
    use_when: you want a small framework-free animation engine with timelines and staggering
    status: candidate
  - branch: frontend/motion
    section: Animation libraries
    tier: alternatives
    name: React Spring
    url: https://github.com/pmndrs/react-spring
    repo: pmndrs/react-spring
    npm: "@react-spring/web"
    search: react-spring pmndrs spring physics animation
    license: MIT
    install: npm i @react-spring/web
    use_when: you want physics-based spring animations in React, or to share code with react-three-fiber scenes
    status: candidate
  - branch: frontend/motion
    section: Animation libraries
    tier: alternatives
    name: AutoAnimate
    url: https://github.com/formkit/auto-animate
    repo: formkit/auto-animate
    npm: "@formkit/auto-animate"
    search: FormKit AutoAnimate
    license: MIT
    install: npm i @formkit/auto-animate
    use_when: you want lists and elements to animate when added, removed or moved, with one line and no config
    status: candidate
  - branch: frontend/motion
    section: Animation libraries
    tier: more
    name: Animate.css
    url: https://animate.style/
    repo: animate-css/animate.css
    npm: animate.css
    search: Animate.css ready-made CSS animations
    license: MIT
    install: npm i animate.css
    use_when: you only need a few ready-made CSS entrance or attention animations, no JS
    status: candidate
  - branch: frontend/motion
    section: Animation libraries
    tier: more
    name: Theatre.js
    url: https://www.theatrejs.com
    repo: theatre-js/theatre
    npm: "@theatre/core"
    search: Theatre.js motion design editor for the web
    license: Apache-2.0 (core); studio editor is AGPL-3.0
    install: npm i @theatre/core @theatre/studio
    use_when: you want a visual keyframe editor for three.js or DOM scenes; use studio only during development
    note: Public repo says development moved to a private repo; last npm release 2024.
    status: candidate
  - branch: frontend/motion
    section: Animation libraries
    tier: more
    name: Popmotion
    url: https://popmotion.io/
    repo: Popmotion/popmotion
    npm: popmotion
    search: Popmotion functional animation library
    license: MIT
    install: npm i popmotion
    use_when: you need low-level tween and spring functions only; prefer Motion for new work
    note: No release since 2022; its ideas live on in Motion.
    status: candidate
  - branch: frontend/motion
    section: Animation libraries
    tier: big_lists
    name: awesome-web-animation
    url: https://github.com/sergey-pimenov/awesome-web-animation
    repo: sergey-pimenov/awesome-web-animation
    search: sergey-pimenov awesome-web-animation
    license: list
    status: candidate

  # ---------- Text and background effects ----------
  - branch: frontend/motion
    section: Text and background effects
    tier: default
    name: Magic UI
    url: https://magicui.design
    repo: magicuidesign/magicui
    search: Magic UI animated components shadcn
    license: MIT
    install: npx shadcn@latest add from the Magic UI docs page of each component
    use_when: you use shadcn/ui and want animated text (text animate, word rotate, shiny text) and backgrounds (grids, dot patterns, particles)
    status: candidate
  - branch: frontend/motion
    section: Text and background effects
    tier: alternatives
    name: React Bits
    url: https://reactbits.dev
    repo: DavidHDev/react-bits
    search: React Bits animated React components DavidHDev
    license: MIT + Commons Clause
    install: npx shadcn@latest add @react-bits/<Component>-TS-TW (or jsrepo, or copy)
    use_when: you want animated text and WebGL-style backgrounds for React; may be used in projects but not resold or redistributed as a library
    never_copy: true
    note: Vue version is DavidHDev/vue-bits.
    status: candidate
  - branch: frontend/motion
    section: Text and background effects
    tier: alternatives
    name: Splitting.js
    url: https://splitting.js.org
    repo: shshaw/Splitting
    npm: splitting
    search: Splitting.js split text into chars words CSS variables
    license: MIT
    install: npm i splitting
    use_when: you want to split text into words and characters with CSS variables for CSS-driven text effects
    status: candidate
  - branch: frontend/motion
    section: Text and background effects
    tier: alternatives
    name: SplitType
    url: https://github.com/lukePeavey/SplitType
    repo: lukePeavey/SplitType
    npm: split-type
    search: SplitType split text lines words chars
    license: ISC
    install: npm i split-type
    use_when: you need line-level text splitting for reveal animations without GSAP SplitText
    status: candidate
  - branch: frontend/motion
    section: Text and background effects
    tier: alternatives
    name: tsParticles
    url: https://particles.js.org
    repo: tsparticles/tsparticles
    npm: tsparticles
    search: tsParticles particles confetti fireworks
    license: MIT
    install: npm i tsparticles (React - npm i @tsparticles/react)
    use_when: you want particle, confetti or firework backgrounds with React, Vue or plain JS wrappers
    status: candidate
  - branch: frontend/motion
    section: Text and background effects
    tier: more
    name: Codrops demos
    url: https://tympanus.net/codrops/demos
    search: Codrops demos tympanus
    license: per repo; many recent demo repos are MIT, some older ones have no license (read only)
    license_url: https://github.com/orgs/codrops/repositories
    use_when: you want to study a specific creative effect; check each demo repo for a LICENSE before copying code
    status: candidate
  - branch: frontend/motion
    section: Text and background effects
    tier: more
    name: Vanta.js
    url: https://github.com/tengbao/vanta
    repo: tengbao/vanta
    npm: vanta
    search: Vanta.js animated 3D backgrounds three.js
    license: MIT
    install: npm i vanta three
    use_when: you want a drop-in animated 3D background (waves, fog, birds) on a plain page
    note: No npm release since 2022; the effects look dated and are widely used.
    status: candidate
  - branch: frontend/motion
    section: Text and background effects
    tier: more
    name: Aceternity UI
    url: https://ui.aceternity.com
    search: Aceternity UI animated components
    license: free and paid items under a custom license; use in end products, no redistribution of source or resale as templates
    license_url: https://ui.aceternity.com/licence
    install: npx shadcn@latest add from each component page
    use_when: you want copy-in React effects like background beams or spotlight; note these are very common in AI-built sites
    never_copy: true
    status: candidate
  - branch: frontend/motion
    section: Text and background effects
    tier: big_lists
    name: awesome-creative-coding
    url: https://github.com/terkelg/awesome-creative-coding
    repo: terkelg/awesome-creative-coding
    search: terkelg awesome-creative-coding
    license: list
    status: candidate

  # ---------- Shaders and WebGL backgrounds ----------
  - branch: frontend/motion
    section: Shaders and WebGL backgrounds
    tier: default
    name: Paper Shaders
    url: https://shaders.paper.design/
    repo: paper-design/shaders
    npm: "@paper-design/shaders-react"
    search: Paper Shaders paper.design mesh gradient
    license: Apache-2.0
    install: npm i @paper-design/shaders-react (vanilla - @paper-design/shaders)
    use_when: you want lightweight shader backgrounds (mesh gradients, grain, dithering) as React components with no three.js
    status: candidate
  - branch: frontend/motion
    section: Shaders and WebGL backgrounds
    tier: alternatives
    name: ShaderGradient
    url: https://www.shadergradient.co/customize
    repo: ruucm/shadergradient
    npm: "@shadergradient/react"
    search: ShaderGradient animated gradient React three.js
    license: MIT
    install: npm i @shadergradient/react @react-three/fiber three three-stdlib camera-controls
    use_when: you want a configurable 3D animated gradient and already use react-three-fiber
    status: candidate
  - branch: frontend/motion
    section: Shaders and WebGL backgrounds
    tier: alternatives
    name: OGL
    url: https://oframe.github.io/ogl/examples
    repo: oframe/ogl
    npm: ogl
    search: OGL minimal WebGL library
    license: Unlicense
    install: npm i ogl
    use_when: you want to write your own full-screen shader effect with a much smaller library than three.js
    status: candidate
  - branch: frontend/motion
    section: Shaders and WebGL backgrounds
    tier: alternatives
    name: three.js
    url: https://threejs.org/
    repo: mrdoob/three.js
    npm: three
    search: three.js WebGL library
    license: MIT
    install: npm i three
    use_when: the background needs real 3D (models, lights, post-processing), not just a 2D shader
    status: candidate
  - branch: frontend/motion
    section: Shaders and WebGL backgrounds
    tier: more
    name: Shadertoy
    url: https://www.shadertoy.com
    search: Shadertoy GLSL shaders
    license: per shader, set by each author; many are non-commercial, so check before porting
    use_when: you want to learn or find a reference for a shader technique; treat it as reference, not a code source
    status: candidate
  - branch: frontend/motion
    section: Shaders and WebGL backgrounds
    tier: big_lists
    name: awesome-glsl
    url: https://github.com/vanrez-nez/awesome-glsl
    repo: vanrez-nez/awesome-glsl
    search: vanrez-nez awesome-glsl
    license: list
    status: candidate
  - branch: frontend/motion
    section: Shaders and WebGL backgrounds
    tier: paid
    name: Unicorn Studio
    url: https://www.unicorn.studio
    search: Unicorn Studio WebGL effects no-code
    license: paid for commercial use; free plan is personal and non-commercial, with a logo watermark
    license_url: https://www.unicorn.studio/docs/pricing/
    note: "Free option: Paper Shaders or ShaderGradient."
    status: candidate

  # ---------- Smooth scroll and scroll effects ----------
  - branch: frontend/motion
    section: Smooth scroll and scroll effects
    tier: default
    name: Lenis
    url: https://github.com/darkroomengineering/lenis
    repo: darkroomengineering/lenis
    npm: lenis
    search: Lenis smooth scroll darkroom engineering
    license: MIT
    install: npm i lenis
    use_when: you want smooth scrolling that keeps native scroll and works with GSAP ScrollTrigger
    note: Old package name @studio-freight/lenis is deprecated; use lenis.
    status: candidate
  - branch: frontend/motion
    section: Smooth scroll and scroll effects
    tier: alternatives
    name: GSAP ScrollTrigger
    url: https://gsap.com/docs/v3/Plugins/ScrollTrigger/
    repo: greensock/GSAP
    npm: gsap
    search: GSAP ScrollTrigger plugin
    license: free, not open source (GSAP Standard "No Charge" license)
    license_url: https://gsap.com/community/standard-license/
    install: npm i gsap, then gsap.registerPlugin(ScrollTrigger)
    use_when: you need pinned sections, scrubbed timelines or complex scroll scenes
    status: candidate
  - branch: frontend/motion
    section: Smooth scroll and scroll effects
    tier: alternatives
    name: CSS scroll-driven animations (MDN)
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Scroll-driven_Animations
    search: MDN CSS scroll-driven animations animation-timeline
    license: docs (CC BY-SA); a web platform feature, nothing to install
    use_when: you want scroll progress or reveal effects in plain CSS with no JS; check browser support and add a fallback
    status: candidate
  - branch: frontend/motion
    section: Smooth scroll and scroll effects
    tier: alternatives
    name: Locomotive Scroll
    url: https://github.com/locomotivemtl/locomotive-scroll
    repo: locomotivemtl/locomotive-scroll
    npm: locomotive-scroll
    search: Locomotive Scroll v5
    license: MIT
    install: npm i locomotive-scroll
    use_when: you want smooth scroll plus data-attribute parallax and in-view classes without writing timelines (v5 is built on Lenis)
    status: candidate
  - branch: frontend/motion
    section: Smooth scroll and scroll effects
    tier: more
    name: scroll-driven-animations.style
    url: https://scroll-driven-animations.style
    search: scroll-driven-animations.style Bramus demos
    license: Apache-2.0 (site source)
    use_when: you want working demos, visualizer tools and a debugger extension for CSS scroll-driven animations
    status: candidate
  - branch: frontend/motion
    section: Smooth scroll and scroll effects
    tier: more
    name: scroll-timeline polyfill
    url: https://github.com/flackr/scroll-timeline
    repo: flackr/scroll-timeline
    search: flackr scroll-timeline polyfill
    license: check repo
    use_when: you use scroll-driven animations and need them in browsers that don't support them yet
    status: candidate
  - branch: frontend/motion
    section: Smooth scroll and scroll effects
    tier: more
    name: AOS
    url: https://michalsnik.github.io/aos/
    repo: michalsnik/aos
    npm: aos
    search: AOS animate on scroll library
    license: MIT
    install: npm i aos
    use_when: you only need simple fade or slide in on scroll via data attributes; CSS scroll-driven animations now cover most of this
    note: Old and little maintained.
    status: candidate

  # ---------- Lottie and Rive ----------
  - branch: frontend/motion
    section: Lottie and Rive
    tier: default
    name: dotLottie web
    url: https://docs.lottiefiles.com/en/runtimes/distributions/js?utm_source=npm&utm_medium=package
    repo: LottieFiles/dotlottie-web
    npm: "@lottiefiles/dotlottie-web"
    search: dotLottie web player LottieFiles
    license: MIT
    install: npm i @lottiefiles/dotlottie-web (React - @lottiefiles/dotlottie-react, web component - @lottiefiles/dotlottie-wc)
    use_when: you want to play Lottie or .lottie files on the web with a small, actively maintained player
    status: candidate
  - branch: frontend/motion
    section: Lottie and Rive
    tier: alternatives
    name: lottie-web
    url: https://github.com/airbnb/lottie-web
    repo: airbnb/lottie-web
    npm: lottie-web
    search: lottie-web Airbnb After Effects animations
    license: MIT
    install: npm i lottie-web
    use_when: you need the original Lottie JSON player with SVG renderer and full After Effects feature coverage
    status: candidate
  - branch: frontend/motion
    section: Lottie and Rive
    tier: alternatives
    name: lottie-react
    url: https://lottiereact.com
    repo: Gamote/lottie-react
    npm: lottie-react
    search: lottie-react hooks component
    license: MIT
    install: npm i lottie-react
    use_when: you want a simple React component and hooks around lottie-web
    status: candidate
  - branch: frontend/motion
    section: Lottie and Rive
    tier: alternatives
    name: Rive web runtime
    url: https://rive.app
    repo: rive-app/rive-wasm
    npm: "@rive-app/canvas"
    search: Rive web runtime canvas wasm
    license: MIT
    install: npm i @rive-app/canvas (or @rive-app/webgl2)
    use_when: you want interactive animations with state machines that react to hover, clicks or app state
    status: candidate
  - branch: frontend/motion
    section: Lottie and Rive
    tier: alternatives
    name: Rive React
    url: https://github.com/rive-app/rive-react
    repo: rive-app/rive-react
    npm: "@rive-app/react-canvas"
    search: rive-react runtime
    license: MIT
    install: npm i @rive-app/react-canvas
    use_when: you use React and want Rive files with hooks for state machine inputs
    status: candidate
  - branch: frontend/motion
    section: Lottie and Rive
    tier: more
    name: LottieFiles free animations
    url: https://lottiefiles.com
    search: LottieFiles free animations
    license: Lottie Simple License (free, commercial use allowed, attribution not required, no scraping to build a rival service)
    license_url: https://lottiefiles.com/page/license
    use_when: you need ready-made Lottie animations (loaders, icons, illustrations)
    status: candidate
  - branch: frontend/motion
    section: Lottie and Rive
    tier: more
    name: Rive community marketplace
    url: https://www.rive.app/docs/community/marketplace-overview
    search: Rive community marketplace files
    license: CC BY 4.0 (credit the author)
    license_url: https://www.rive.app/docs/community/marketplace-overview
    use_when: you want ready-made Rive files to remix; credit the author
    status: candidate
  - branch: frontend/motion
    section: Lottie and Rive
    tier: big_lists
    name: awesome-lottie
    url: https://github.com/LottieFiles/awesome-lottie
    repo: LottieFiles/awesome-lottie
    search: LottieFiles awesome-lottie
    license: list
    status: candidate
