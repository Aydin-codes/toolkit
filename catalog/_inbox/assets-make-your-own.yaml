proposals:
  # ---------- 3D ----------
  - branch: assets/make-your-own
    branch_title: Make your own assets
    section: 3D
    tier: default
    name: Blender
    url: https://www.blender.org
    repo: blender/blender
    search: Blender 3D creation suite
    license: GPL-3.0
    license_url: https://docs.blender.org/manual/en/4.2/getting_started/about/license.html
    install: download from blender.org
    use_when: you need to model, texture, rig, animate or render 3D assets and export glTF for the web
    note: GitHub repo is the official mirror of projects.blender.org
    status: candidate
  - branch: assets/make-your-own
    section: 3D
    tier: alternatives
    name: Blender MCP
    url: https://github.com/ahujasid/blender-mcp
    repo: ahujasid/blender-mcp
    search: ahujasid blender-mcp MCP for Blender
    license: MIT
    install: "claude mcp add blender uvx mcp-for-blender, then uvx mcp-for-blender install-addon"
    use_when: you want an agent to drive a running Blender over MCP to build or edit scenes
    note: PyPI package is mcp-for-blender; needs Blender installed and the add-on enabled
    status: candidate
  - branch: assets/make-your-own
    section: 3D
    tier: alternatives
    name: Blockbench
    url: https://www.blockbench.net
    repo: JannisX11/blockbench
    search: Blockbench low-poly model editor
    license: GPL-3.0
    install: download, or use the web app
    use_when: you want low-poly or blocky models with pixel-art textures, quick to learn
    status: candidate
  - branch: assets/make-your-own
    section: 3D
    tier: alternatives
    name: FreeCAD
    url: https://www.freecad.org
    repo: FreeCAD/FreeCAD
    search: FreeCAD parametric 3D CAD
    license: LGPL-2.1
    install: download from freecad.org
    use_when: you need precise parametric CAD parts rather than artistic models
    status: candidate
  - branch: assets/make-your-own
    section: 3D
    tier: alternatives
    name: Mixamo
    url: https://helpx.adobe.com/creative-cloud/faq/mixamo-faq.html
    search: Adobe Mixamo free character animations auto-rig
    license: free with an Adobe ID, not open source; characters and animations royalty-free for commercial use
    license_url: https://helpx.adobe.com/creative-cloud/faq/mixamo-faq.html
    install: web app, sign in with an Adobe ID, download FBX
    use_when: you need a humanoid character auto-rigged or stock animations (walk, run, idle) fast
    note: url is the official FAQ page; mixamo.com itself was not opened. Not for Enterprise/Federated IDs.
    status: candidate
  - branch: assets/make-your-own
    section: 3D
    tier: more
    name: MagicaVoxel
    url: https://ephtracy.github.io/
    search: MagicaVoxel voxel editor ephtracy
    license: free, not open source; no license text found on the official site
    install: download from the official site
    use_when: you want voxel-style models and quick voxel renders
    note: copyright shown runs 2011-2021, so updates may have slowed; license not confirmed
    status: candidate
  - branch: assets/make-your-own
    section: 3D
    tier: big_lists
    name: awesome-blender
    url: https://github.com/agmmnn/awesome-blender
    repo: agmmnn/awesome-blender
    search: agmmnn awesome-blender
    license: CC0-1.0
    status: candidate

  # ---------- Vector ----------
  - branch: assets/make-your-own
    section: Vector
    tier: default
    name: Inkscape
    url: https://inkscape.org
    search: Inkscape vector graphics editor
    license: GPL (version not checked; source at gitlab.com/inkscape/inkscape)
    install: download from inkscape.org
    use_when: you need to draw or edit SVG illustrations, icons and logos
    note: license page could not be read; main repo is on GitLab, the GitHub copy has no license file
    status: candidate
  - branch: assets/make-your-own
    section: Vector
    tier: alternatives
    name: SVGO
    url: https://svgo.dev
    repo: svg/svgo
    npm: svgo
    search: SVGO SVG optimizer
    license: MIT
    install: npm i -D svgo
    use_when: you want to shrink and clean SVG files from the command line or a build step
    status: candidate
  - branch: assets/make-your-own
    section: Vector
    tier: alternatives
    name: SVGOMG
    url: https://jakearchibald.github.io/svgomg/
    repo: jakearchibald/svgomg
    search: SVGOMG web GUI for SVGO
    license: MIT
    install: web app, no install
    use_when: you want to optimise one SVG in the browser and preview each SVGO option
    status: candidate

  # ---------- Painting and raster ----------
  - branch: assets/make-your-own
    section: Painting and raster
    tier: default
    name: Krita
    url: https://www.krita.org
    repo: KDE/krita
    search: Krita digital painting
    license: GPL-3.0
    install: download from krita.org
    use_when: you need to paint illustrations, textures or concept art with a tablet
    note: GitHub repo is a mirror of invent.kde.org/graphics/krita
    status: candidate
  - branch: assets/make-your-own
    section: Painting and raster
    tier: alternatives
    name: GIMP
    url: https://www.gimp.org/
    repo: GNOME/gimp
    search: GIMP GNU image manipulation program
    license: GPL-3.0
    install: download from gimp.org
    use_when: you need general raster editing, retouching and layer work; also fits photo editing
    note: GitHub repo is a read-only mirror of gitlab.gnome.org/GNOME/gimp
    status: candidate
  - branch: assets/make-your-own
    section: Painting and raster
    tier: alternatives
    name: Pixelorama
    url: https://www.pixelorama.org/
    repo: Orama-Interactive/Pixelorama
    search: Pixelorama pixel art editor Godot
    license: MIT
    install: download, or web build at https://orama-interactive.github.io/Pixelorama/
    use_when: you want a free open-source pixel art and sprite animation editor
    status: candidate
  - branch: assets/make-your-own
    section: Painting and raster
    tier: alternatives
    name: Photopea
    url: https://www.photopea.com/
    search: Photopea online photo editor PSD
    license: free, not open source (web app)
    install: web app, no install
    use_when: you need to open or edit PSD files in the browser without installing anything
    note: free tier is reported to show ads; not confirmed from the page
    status: candidate
  - branch: assets/make-your-own
    section: Painting and raster
    tier: paid
    name: Aseprite
    url: https://www.aseprite.org
    repo: aseprite/aseprite
    search: Aseprite animated sprite editor
    license: paid; source available under the Aseprite EULA (some modules MIT)
    license_url: https://github.com/aseprite/aseprite
    install: buy from aseprite.org or Steam
    never_copy: true
    note: "Free option: Pixelorama."
    status: candidate

  # ---------- Photo editing ----------
  - branch: assets/make-your-own
    section: Photo editing
    tier: alternatives
    name: rembg
    url: https://github.com/danielgatis/rembg
    repo: danielgatis/rembg
    search: rembg background removal Python
    license: MIT
    install: pip install rembg
    use_when: you need to remove image backgrounds locally from a script or CLI
    status: candidate
  - branch: assets/make-your-own
    section: Photo editing
    tier: alternatives
    name: Squoosh
    url: https://github.com/GoogleChromeLabs/squoosh
    repo: GoogleChromeLabs/squoosh
    search: Squoosh image compression web app
    license: Apache-2.0
    install: web app; the npm CLI @squoosh/cli exists but its status was not checked
    use_when: you want to compress and convert images (WebP, AVIF) and compare quality side by side
    status: candidate

  # ---------- Audio ----------
  - branch: assets/make-your-own
    section: Audio
    tier: alternatives
    name: jsfxr
    url: https://github.com/chr15m/jsfxr
    repo: chr15m/jsfxr
    npm: jsfxr
    search: jsfxr sfxr game sound effects JavaScript
    license: not stated in npm metadata; check the repo
    install: npm i jsfxr, or use the web generator
    use_when: you need retro game sound effects (jumps, coins, hits) generated in seconds
    status: candidate

  # ---------- Design and mockups ----------
  - branch: assets/make-your-own
    section: Design and mockups
    tier: default
    name: Penpot
    url: https://penpot.app
    repo: penpot/penpot
    search: Penpot open source design tool
    license: MPL-2.0
    install: web app, or self-host with Docker (https://penpot.app/self-host)
    use_when: you want an open-source Figma-style design and prototyping tool you can self-host
    status: candidate
  - branch: assets/make-your-own
    section: Design and mockups
    tier: alternatives
    name: Excalidraw
    url: https://github.com/excalidraw/excalidraw
    repo: excalidraw/excalidraw
    npm: "@excalidraw/excalidraw"
    search: Excalidraw hand-drawn whiteboard
    license: MIT
    install: web app, or npm i @excalidraw/excalidraw to embed
    use_when: you want quick hand-drawn style diagrams and wireframes
    status: candidate
  - branch: assets/make-your-own
    section: Design and mockups
    tier: alternatives
    name: tldraw
    url: https://tldraw.dev
    repo: tldraw/tldraw
    npm: tldraw
    search: tldraw infinite canvas SDK
    license: custom tldraw license (npm says SEE LICENSE IN LICENSE.md)
    install: npm i tldraw
    use_when: you want to embed a whiteboard canvas in your own app
    note: reported to need a license key in production; license file not read
    status: candidate
  - branch: assets/make-your-own
    section: Design and mockups
    tier: paid
    name: Figma
    url: https://www.figma.com/pricing/
    search: Figma design tool
    license: free plan for individuals (3 projects, 2 members, 30-day version history); paid plans beyond that
    license_url: https://www.figma.com/pricing/
    install: web app or desktop app
    note: "Free option: Penpot."
    status: candidate
