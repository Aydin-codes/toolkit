  npm: postprocessing
  search: pmndrs postprocessing three.js effects
  license: Zlib
  install: npm i postprocessing
  use_when: you need bloom, depth of field or other post effects in plain three.js with merged passes
  status: candidate
- branch: frontend/3d
  branch_title: 3D on the web
