proposals:
- branch: frontend/3d
  branch_title: 3D on the web
  section: Engines
  tier: default
  name: Three.js
  url: https://threejs.org
  repo: mrdoob/three.js
  npm: three
  search: three.js JavaScript 3D library
  license: MIT
  install: npm i three
  use_when: you need a general WebGL/WebGPU 3D library with the largest ecosystem
  status: candidate
- branch: frontend/3d
  branch_title: 3D on the web
  section: Engines
  tier: alternatives
  name: Babylon.js
  url: https://www.babylonjs.com
  repo: BabylonJS/Babylon.js
  npm: '@babylonjs/core'
  search: Babylon.js web 3D engine
  license: Apache-2.0
  install: npm i @babylonjs/core
  use_when: you want a full engine with built-in physics, GUI, inspector and an online playground
  status: candidate
- branch: frontend/3d
  branch_title: 3D on the web
  section: Engines
  tier: alternatives
  name: PlayCanvas Engine
  url: https://playcanvas.com
  repo: playcanvas/engine
  npm: playcanvas
  search: PlayCanvas WebGL game engine open source
  license: MIT
  install: npm i playcanvas
  use_when: you are building a browser game or configurator and want an engine with an optional hosted editor
  note: The engine is MIT; the hosted editor has free and paid plans.
  status: candidate
- branch: frontend/3d
  branch_title: 3D on the web
  section: Engines
  tier: alternatives
  name: A-Frame
  url: https://aframe.io
  repo: aframevr/aframe
  npm: aframe
  search: A-Frame WebXR framework HTML
  license: MIT
  install: npm i aframe (or a script tag)
  use_when: you want VR/AR scenes written as HTML tags on top of three.js
  status: candidate
- branch: frontend/3d
  branch_title: 3D on the web
  section: Engines
  tier: alternatives
  name: model-viewer
  url: https://modelviewer.dev
  repo: google/model-viewer
  npm: '@google/model-viewer'
  search: Google model-viewer web component glTF
  license: Apache-2.0
  install: npm i @google/model-viewer
  use_when: you only need to show one glTF model with orbit controls and AR, no custom scene code
  status: candidate
- branch: frontend/3d
  branch_title: 3D on the web
  section: Engines
  tier: alternatives
  name: OGL
  url: https://github.com/oframe/ogl
  repo: oframe/ogl
  npm: ogl
  search: OGL minimal WebGL library oframe
  license: Unlicense
  install: npm i ogl
  use_when: you want a very small WebGL library for shader-heavy effects and can do without three.js extras
  status: candidate
- branch: frontend/3d
  branch_title: 3D on the web
  section: Engines
  tier: more
