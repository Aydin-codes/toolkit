  license: Zlib
  install: npm i ammo.js (or a build from the repo)
  use_when: you need Bullet features such as soft bodies and accept an older, less active project
  note: The npm package is old; most projects use a build from the repo.
  status: candidate
- branch: frontend/3d
  branch_title: 3D on the web
  section: Model tools and compression
  tier: default
