  license: free web app, not open source
  license_url: https://gltf-transform.dev
  install: open in browser
  use_when: you want to inspect a model's size, meshes and textures and run glTF Transform scripts in the browser
  note: Built on glTF Transform (MIT).
  status: candidate
- branch: frontend/3d
  branch_title: 3D on the web
  section: Model tools and compression
  tier: alternatives
  name: Blender
  url: https://www.blender.org
