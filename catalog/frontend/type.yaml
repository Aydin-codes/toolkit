branch: frontend/type
title: Typography
intro: Where to get free fonts, starting picks by style, type-scale tools, and the fonts AI tools pick by default. Taste decisions (which pairing suits this brand) belong to a design skill; this file says what exists.
sections:
  - name: Font sources
    default:
      name: Google Fonts
      url: https://fonts.google.com
      search: Google Fonts
      licence: mostly OFL (check each family)
      install: CDN link, or self-host through Fontsource
      status: candidate
      checked: 2026-11-26
    alternatives:
      - name: Fontsource
        url: https://fontsource.org
        search: Fontsource npm fonts
        licence: per font, mostly OFL
        use_when: you want to self-host Google and other open fonts as npm packages
        install: npm i @fontsource/<font>
        status: candidate
        checked: 2026-11-26
      - name: Fontshare
        url: https://www.fontshare.com
        search: Fontshare Indian Type Foundry free fonts
        licence: free, not open source (ITF licence); load from Fontshare's CDN, don't redistribute
        use_when: you want high-quality free fonts that aren't on Google Fonts
        install: CDN link from fontshare.com
        never_copy: true
        status: candidate
        checked: 2026-11-26
      - name: Velvetyne
        url: https://velvetyne.fr
        search: Velvetyne libre fonts
        licence: OFL
        use_when: you want experimental, characterful display faces
        install: download
        status: candidate
        checked: 2026-11-26
      - name: Collletttivo
        url: https://www.collletttivo.it
        search: Collletttivo open source type foundry
        licence: OFL
        use_when: you want contemporary open-source faces from independent designers
        install: download
        status: candidate
        checked: 2026-11-26
      - name: Uncut
        url: https://uncut.wtf
        search: uncut.wtf libre typeface catalogue
        licence: OFL (check each)
        use_when: you want a curated catalogue of contemporary libre fonts
        install: download from each font's page
        status: candidate
        checked: 2026-11-26
    big_lists:
      - name: Velvetyne Libre Friends
        url: https://velvetyne.fr/velvetyne-libre-friends
        search: Velvetyne Libre Friends free foundries list
        licence: list of OFL / libre foundries
        status: candidate
        checked: 2026-11-26
      - name: Free Faces
        url: https://www.freefaces.gallery
        search: Free Faces gallery free typefaces
        licence: mixed; check each font
        status: candidate
        checked: 2026-11-26
      - name: awesome-typography
        url: https://github.com/Jolg42/awesome-typography
        search: Jolg42 awesome-typography
        licence: list
        status: candidate
        checked: 2026-11-26
    paid:
      - name: Adobe Fonts
        url: https://fonts.adobe.com
        search: Adobe Fonts
        licence: paid (with a Creative Cloud plan)
        note: "Free option: Google Fonts or Fontshare."
        status: candidate
        checked: 2026-11-26

  - name: More libre foundries
    list:
      - name: Open Foundry
        url: https://open-foundry.com
        search: Open Foundry open source typefaces
        licence: OFL
        use_when: you want to test fonts on a clean specimen page first
        install: download
        status: candidate
        checked: 2026-11-26
      - name: The League of Moveable Type
        url: https://www.theleagueofmoveabletype.com
        search: League of Moveable Type
        licence: OFL
        use_when: you want classic, well-made open-source faces
        install: download
        status: candidate
        checked: 2026-11-26

