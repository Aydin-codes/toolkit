branch: frontend/type
title: Typography
intro: Where to get free fonts, starting picks by style, type-scale tools, and the fonts AI tools pick by default. Taste decisions (which pairing suits this brand) belong to a design skill; this file says
  what exists.
sections:
- name: Font sources
  default:
    name: Google Fonts
    url: https://fonts.google.com
    search: Google Fonts
    license: mostly OFL (check each family)
    install: CDN link, or self-host through Fontsource
    status: candidate
    checked: 2026-11-26
    facts:
      checked: '2026-11-27'
      link: 200
    problems:
    - license has no evidence (add license_url)
  alternatives:
  - name: Fontsource
    url: https://fontsource.org
    search: Fontsource npm fonts
    license: per font, mostly OFL
    use_when: you want to self-host Google and other open fonts as npm packages
    install: npm i @fontsource/<font>
    status: candidate
    checked: 2026-11-26
    facts:
      checked: '2026-11-27'
      link: 200
    problems:
    - license has no evidence (add license_url)
  - name: Fontshare
    url: https://www.fontshare.com
    search: Fontshare Indian Type Foundry free fonts
    license: free, not open source (ITF license); load from Fontshare's CDN, don't redistribute
    use_when: you want high-quality free fonts that aren't on Google Fonts
    install: CDN link from fontshare.com
    never_copy: true
    status: candidate
    checked: 2026-11-26
    facts:
      checked: '2026-11-27'
      link: 200
    problems:
    - license has no evidence (add license_url)
  - name: Velvetyne
    url: https://velvetyne.fr
    search: Velvetyne libre fonts
    license: OFL
    use_when: you want experimental, characterful display faces
    install: download
    status: candidate
    checked: 2026-11-26
    facts:
      checked: '2026-11-27'
      link: 200
    problems:
    - license has no evidence (add license_url)
  - name: Collletttivo
    url: https://www.collletttivo.it
    search: Collletttivo open source type foundry
    license: OFL
    use_when: you want contemporary open-source faces from independent designers
    install: download
    status: candidate
    checked: 2026-11-26
    facts:
      checked: '2026-11-27'
      link: 200
    problems:
    - license has no evidence (add license_url)
  - name: Uncut
    url: https://uncut.wtf
    search: uncut.wtf libre typeface catalogue
    license: OFL (check each)
    use_when: you want a curated catalogue of contemporary libre fonts
    install: download from each font's page
    status: candidate
    checked: 2026-11-26
    facts:
      checked: '2026-11-27'
      link: 200
    problems:
    - license has no evidence (add license_url)
  big_lists:
  - name: Velvetyne Libre Friends
    url: https://velvetyne.fr/velvetyne-libre-friends
