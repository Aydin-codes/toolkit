  - name: awesome-typography
    url: https://github.com/Jolg42/awesome-typography
    search: Jolg42 awesome-typography
    license: list
    status: candidate
    checked: 2026-11-26
    facts:
      checked: '2026-11-27'
      link: 200
      stars: 1554
      pushed: '2026-11-18'
      archived: false
      gh_license: CC0-1.0
    problems:
    - license says 'list' but gh_license is CC0-1.0
  paid:
  - name: Adobe Fonts
    url: https://fonts.adobe.com
    search: Adobe Fonts
    license: paid (with a Creative Cloud plan)
