  - name: Capsize
    url: https://seek-oss.github.io/capsize/
    search: Capsize SEEK text trimming
    license: MIT
    install: npm i @capsizecss/core
    note: trims the extra space above and below text so it aligns
    status: candidate
    checked: 2026-11-26
    facts:
      checked: '2026-11-27'
      link: 200
    problems:
    - license has no evidence (add license_url)
- name: Common AI picks
  note: 'Fine when chosen on purpose for this product; don''t default to them. Same list as design-studio''s font picker: Inter, Geist, Space Grotesk, Instrument Serif, Outfit, Plus Jakarta Sans, DM Sans,
    Manrope, Bricolage Grotesque, Sora, Urbanist, Poppins, Montserrat, Roboto, Open Sans, Lato, Playfair Display, IBM Plex Mono, JetBrains Mono.'
