  - name: Type scale and fitting tools
    list:
      - { name: Utopia, url: "https://utopia.fyi", search: "Utopia fluid type scale", licence: free tool, note: "fluid type and space scales in CSS clamp()", status: candidate, checked: 2026-11-26 }
      - { name: Typescale, url: "https://typescale.com", search: "Typescale type scale generator", licence: free tool, status: candidate, checked: 2026-11-26 }
      - { name: Capsize, url: "https://seek-oss.github.io/capsize/", search: "Capsize SEEK text trimming", licence: MIT, install: "npm i @capsizecss/core", note: "trims the extra space above and below text so it aligns", status: candidate, checked: 2026-11-26 }

  - name: Common AI picks
    note: "Fine when chosen on purpose for this product; don't default to them. Same list as design-studio's font picker: Inter, Geist, Space Grotesk, Instrument Serif, Outfit, Plus Jakarta Sans, DM Sans, Manrope, Bricolage Grotesque, Sora, Urbanist, Poppins, Montserrat, Roboto, Open Sans, Lato, Playfair Display, IBM Plex Mono, JetBrains Mono."
