intro: Every family in this style on Google Fonts, imported from Google's own metadata (github.com/google/fonts). Open the specimen and test with real text before choosing. Fonts marked common AI pick are
  fine on purpose but shouldn't be a default. For curated starting picks, see reference/frontend/type.md.
