    url: https://docs.renovatebot.com/
    repo: renovatebot/renovate
    npm: renovate
    search: Renovate dependency update bot
    license: AGPL-3.0-only
    install: Mend Renovate GitHub app (free), or npx renovate
    use_when: you want automatic dependency update PRs with grouping and schedules, on GitHub, GitLab or others
    note: 'Hosted app: https://docs.renovatebot.com/mend-hosted/overview/ (Community tier is free).'
