- name: Analytics
  default:
    name: Plausible
    url: https://plausible.io
    repo: plausible/analytics
    npm: '@plausible-analytics/tracker'
    search: Plausible privacy-friendly analytics
    license: AGPL-3.0 (Community Edition); tracker MIT; cloud is paid
    license_url: https://plausible.io/#pricing
    install: script tag, or npm i @plausible-analytics/tracker; self-host with https://github.com/plausible/community-edition/
    use_when: you want simple, cookie-free page analytics
    note: Cloud from $9/month with a 30-day free trial; self-hosted Community Edition is free (https://plausible.io/self-hosted-web-analytics).
    status: verified
    facts:
      checked: '2026-11-27'
      link: 200
      license_link: 200
      stars: 29957
      pushed: '2026-11-27'
      archived: false
      gh_license: AGPL-3.0
      npm_license: MIT
      npm_modified: '2026-10-28'
      npm_error: 429
    verified_by: auto
  alternatives:
  - name: Vercel Web Analytics
    url: https://vercel.com/docs/analytics
    search: Vercel Web Analytics
    license: free tier, then paid
    license_url: https://vercel.com/pricing
    install: npm i @vercel/analytics
    use_when: your site is already on Vercel and you want page views with no extra service
    note: Hobby plan includes 50K events a month.
    status: verified
    facts:
      checked: '2026-11-27'
      link: 200
      license_link: 200
    verified_by: auto
