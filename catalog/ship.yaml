branch: ship
title: Ship and run
intro: ''
sections:
- name: Hosting
  default:
    name: Vercel
    url: https://vercel.com
    repo: vercel/vercel
    npm: vercel
    search: Vercel hosting Hobby plan
    license: free tier (Hobby), then paid; CLI is Apache-2.0
    license_url: https://vercel.com/pricing
    install: npm i -g vercel
    use_when: you deploy a Next.js or other frontend app and want git push deploys with preview URLs
    note: Hobby is $0 with hard caps (1M function invocations, 100 GB transfer, 1 seat a month) and no paid overage; see https://vercel.com/docs/limits/fair-use-guidelines and https://vercel.com/legal/terms.
    status: verified
    facts:
      checked: '2026-11-27'
      link: 200
      license_link: 200
      stars: 16681
      pushed: '2026-11-25'
      archived: false
      gh_license: Apache-2.0
      npm_license: Apache-2.0
      npm_modified: '2026-11-27'
      npm_error: 429
    verified_by: auto
  alternatives:
  - name: Netlify CLI
    url: https://github.com/netlify/cli
    repo: netlify/cli
    npm: netlify-cli
    search: Netlify hosting netlify-cli
    license: MIT (CLI); Netlify hosting has a free tier, then paid
    install: npm i -g netlify-cli
    use_when: you host a static site or Jamstack app on Netlify and want to deploy from the terminal
    note: Pricing page URL not checked yet.
    status: verified
    facts:
      checked: '2026-11-27'
      link: 200
      stars: 1936
      pushed: '2026-11-27'
      archived: false
