    url: https://weasyprint.org/
    repo: Kozea/WeasyPrint
    search: WeasyPrint HTML CSS to PDF Python
    license: BSD-3-Clause
    install: pip install weasyprint
    use_when: you already have HTML and CSS and want print-quality PDFs from Python without a browser
    status: verified
    facts:
      checked: '2026-11-27'
      link: 200
      stars: 9815
      pushed: '2026-11-24'
      archived: false
