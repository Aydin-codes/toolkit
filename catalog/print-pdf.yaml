branch: print-pdf
title: Docs, print and PDF
intro: ''
sections:
- name: Make PDFs
  default:
    name: Typst
    url: https://typst.app
    repo: typst/typst
    search: Typst typesetting system
    license: Apache-2.0
    install: cargo install --locked typst-cli, brew install typst, or download a release binary; typst compile doc.typ
    use_when: you want a fast, scriptable markup language that compiles straight to PDF with one small binary
    status: verified
    facts:
      checked: '2026-11-27'
      link: 200
      stars: 57477
      pushed: '2026-11-27'
      archived: false
      gh_license: Apache-2.0
    verified_by: auto
  alternatives:
