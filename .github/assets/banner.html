<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>toolkit banner</title>
<!--
  Source for banner.png (1440x360) and social-preview.png (1280x640).
  Re-render with headless Chrome at 2x, e.g.:
    chrome --headless=new --force-device-scale-factor=2 --window-size=1440,360 --screenshot=banner.png banner.html
    chrome --headless=new --force-device-scale-factor=1 --window-size=1280,640 --screenshot=social-preview.png "banner.html#social"
  The logo is logo.svg in this folder. The three entries on the right are real catalog entries (catalog/frontend/type.yaml).
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;800&display=swap">
<style>
  :root { --bg:#f3f1ed; --ink:#161616; --muted:#5f5d58; --card:#fff; --line:#dcd8d0; --chip:#ebe7df; --ok:#2f7a4a; }
  * { box-sizing:border-box; margin:0; }
  html, body { width:1440px; height:360px; background:var(--bg); font-family:"Public Sans", system-ui, sans-serif; color:var(--ink); overflow:hidden; }
  .wrap { height:100%; display:flex; align-items:center; justify-content:space-between; padding:0 80px; }
  h1 { font-size:96px; font-weight:800; letter-spacing:-0.045em; line-height:1; display:flex; align-items:center; gap:24px; }
  h1 img { width:92px; height:92px; flex:none; }
  .count { margin-top:12px; font-size:18px; font-weight:500; color:var(--ink); }
  p { margin-top:18px; font-size:24px; color:var(--muted); }
  .list { width:430px; display:grid; gap:12px; }
  .e { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .e b { font-size:17px; font-weight:700; }
  .e span { display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); }
  .chip { background:var(--chip); border-radius:999px; padding:3px 10px; color:var(--ink); }
  .ok { color:var(--ok); font-weight:500; }
  i { font-style:normal; }
  .e.pick { border:2px solid var(--ink); box-shadow:0 10px 24px rgba(0,0,0,.08); }
  /* social preview: 1280x640 */
  .social, .social body { width:1280px; height:640px; }
  .social .wrap { padding:0 80px; }
  .social h1 { font-size:104px; }
  .social h1 img { width:100px; height:100px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1><img src="logo.svg" alt="">toolkit</h1>
    <p>What exists. How to pick. How to check.</p>
    <p class="count">2,300+ entries, each with a link and a license</p>
  </div>
  <div class="list">
    <div class="e"><b>Google Fonts</b><span><i class="chip">mostly OFL</i><i class="ok">checked</i></span></div>
    <div class="e pick"><b>Fontsource</b><span><i class="chip">per font, mostly OFL</i><i class="ok">checked</i></span></div>
    <div class="e"><b>Velvetyne</b><span><i class="chip">OFL</i><i class="ok">checked</i></span></div>
  </div>
</div>
<script>if (location.hash === "#social") document.documentElement.classList.add("social");</script>
</body>
</html>
