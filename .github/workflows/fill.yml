name: Fill pipeline
# Runs the checks on new catalog proposals (links, licenses, stars, activity, duplicates),
# places the ones that pass, rebuilds the pages and commits the result to the same branch.
on:
  push:
    branches: ["fill/**"]
    paths: ["catalog/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fill-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: Enrich, gate, merge, build
        run: python scripts/pipeline.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalog reference runs
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Pipeline: check and place proposals"
          git push
      - name: Summary
        run: cat "$(ls -t runs/*.md | head -1)" >> "$GITHUB_STEP_SUMMARY"
