name: Suggest a tool
description: A library, font, asset source, repo or list the toolkit should include
labels: [candidate]
body:
  - type: input
    id: name
    attributes: { label: Name }
    validations: { required: true }
  - type: input
    id: url
    attributes: { label: Official link, placeholder: "https://" }
    validations: { required: true }
  - type: input
    id: branch
    attributes: { label: Which branch, placeholder: "frontend/ui, assets/ready-made, print-pdf, ..." }
  - type: input
    id: licence
    attributes: { label: Licence, placeholder: "MIT, OFL, CC0, free but not open source, paid ..." }
  - type: textarea
    id: why
    attributes: { label: "When would you pick it over what's listed?", description: "One or two lines. A link to a real project that uses it helps." }
    validations: { required: true }
